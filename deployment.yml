apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsilon-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: epsilon-webapp
  template:
    metadata:
      labels:
        app: epsilon-webapp
    spec:
      containers:
        - name: epsilon-webapp
          image: epsilon-webapp:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 3000